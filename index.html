<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dart Score Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Dart Score Trainer</h1>
    <div id="target-display">Checkout: <span id="target"></span></div>
    <div id="board-container"></div>
    <div id="info">
      <div id="darts"></div>
      <div id="status"></div>
      <div id="route"></div>
    </div>
    <div id="range-controls">
      <label>Min <input type="number" id="min-target" min="41" max="170" value="41"></label>
      <label>Max <input type="number" id="max-target" min="41" max="170" value="170"></label>
      <button class="quick-select" data-min="41" data-max="100">41–100</button>
      <button class="quick-select" data-min="100" data-max="170">100–170</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
